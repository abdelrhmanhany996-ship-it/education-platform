name: Android app (protected)

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Platform URL the app opens'
        required: false
        default: 'https://education-platform-99n5.vercel.app'
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PappUrl="${{ github.event.inputs.app_url || 'https://education-platform-99n5.vercel.app' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: academic-platform-apk
          path: android/app/build/outputs/apk/release/app-release.apk
