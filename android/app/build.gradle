plugins {
    id 'com.android.application'
}

android {
    namespace 'com.academic.platform'
    compileSdk 35

    defaultConfig {
        applicationId 'com.academic.platform'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('appUrl')}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Optional release signing from environment (CI); without it the release build is signed with the debug key
    def ks = System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
