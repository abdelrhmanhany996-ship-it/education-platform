plugins {
    id 'com.android.application'
}

android {
    namespace 'com.academic.platform'
    compileSdk 35

    defaultConfig {
        applicationId 'com.academic.platform'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'APP_URL', "\"${project.findProperty('appUrl')}\""
        // Signing key registered with the server by CI (APP_SIGN_KEY, 64 hex chars), stored split in two halves
        def signKey = (System.getenv('APP_SIGN_KEY') ?: '').trim()
        def rnd = new java.security.SecureRandom()
        def mask = signKey ? (0..<32).collect { rnd.nextInt(256) } : []
        def keyBytes = signKey ? (0..<32).collect { Integer.parseInt(signKey.substring(it * 2, it * 2 + 2), 16) } : []
        buildConfigField 'String', 'K1', "\"${(0..<keyBytes.size()).collect { String.format('%02x', keyBytes[it] ^ mask[it]) }.join()}\""
        buildConfigField 'String', 'K2', "\"${mask.collect { String.format('%02x', it) }.join()}\""
    }

    buildFeatures {
        buildConfig true
    }

    // Optional release signing from environment (CI); without it the release build is signed with the debug key
    def ks = System.getenv('ANDROID_KEYSTORE_FILE')
    signingConfigs {
        if (ks) {
            release {
                storeFile file(ks)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ks ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
